<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- 加入 maximum-scale=1.0 和 user-scalable=no 防止手機點擊時意外放大畫面 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 教練俄羅斯方塊 - 手機觸控版</title>
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
            touch-action: manipulation; /* 停用點擊縮放 */
        }
        h1 { margin: 10px 0; font-size: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); text-align: center; }
        
        #game-container {
            display: flex;
            flex-direction: row; /* 電腦版左右排列 */
            gap: 20px;
            background: #34495e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 100%;
        }

        /* 讓 Canvas 在手機上能自動縮小 */
        canvas {
            background-color: #1a252f;
            border: 2px solid #7f8c8d;
            border-radius: 4px;
            width: 100%;
            max-width: 300px;
            height: auto;
            aspect-ratio: 1 / 2;
        }

        #ui-panel { display: flex; flex-direction: column; gap: 15px; width: 200px; }
        .box { background: #2c3e50; padding: 15px; border-radius: 8px; border: 1px solid #7f8c8d; }
        #score { font-size: 24px; font-weight: bold; color: #f1c40f; }
        #coach-message { color: #2ecc71; font-weight: bold; min-height: 45px; line-height: 1.5; font-size: 14px;}
        
        button {
            padding: 10px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #c0392b; }
        
        /* 電腦版隱藏虛擬按鍵，保留鍵盤說明 */
        .controls { font-size: 12px; color: #bdc3c7; line-height: 1.8; }
        #mobile-controls { display: none; }

        /* 手機版樣式 (當螢幕寬度小於 600px 時套用) */
        @media (max-width: 600px) {
            #game-container {
                flex-direction: column; /* 改為上下排列 */
                align-items: center;
                padding: 10px;
                gap: 10px;
            }
            #ui-panel { width: 100%; max-width: 300px; gap: 10px; }
            .controls { display: none; } /* 手機版隱藏文字說明 */
            
            /* 顯示虛擬按鍵 */
            #mobile-controls {
                display: flex;
                justify-content: space-between;
                width: 100%;
                max-width: 300px;
                margin-top: 10px;
                gap: 5px;
            }
            .ctrl-btn {
                flex: 1;
                background: #3498db;
                font-size: 20px;
                padding: 15px 0;
                border-radius: 8px;
            }
            .ctrl-btn:active { background: #2980b9; }
            .btn-danger { background: #e67e22; }
            .btn-danger:active { background: #d35400; }
        }
    </style>
</head>
<body>

    <h1>🧠 AI 教練俄羅斯方塊</h1>
    
    <audio id="bgm" loop>
        <source src="https://archive.org/download/FluffingADuck/Fluffing%20a%20Duck.mp3" type="audio/mpeg">
    </audio>

    <div id="game-container">
        <canvas id="tetris" width="300" height="600"></canvas>
        <div id="ui-panel">
            <div class="box">
                <div>分數</div>
                <div id="score">0</div>
            </div>
            <div class="box">
                <div>教練建議 💡</div>
                <div id="coach-message">等待開始...</div>
            </div>
            <button id="start-btn">開始遊戲</button>
            
            <div class="box controls">
                <strong>鍵盤操作：</strong><br>
                ⬅️ ➡️ : 左右移動<br>
                ⬆️ : 旋轉方向<br>
                ⬇️ : 加速落下<br>
                空白鍵 : 瞬間落下
            </div>
            
            <!-- 手機虛擬按鍵 -->
            <div id="mobile-controls">
                <button class="ctrl-btn" id="btn-left">⬅️</button>
                <button class="ctrl-btn" id="btn-down">⬇️</button>
                <button class="ctrl-btn" id="btn-right">➡️</button>
                <button class="ctrl-btn" id="btn-rotate">↻</button>
                <button class="ctrl-btn btn-danger" id="btn-drop">⏬</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 初始化音效引擎
        // ==========================================
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') return; // 手機尚未解鎖音效前不播放
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'drop') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'clear') {
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                oscillator.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'move') {
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'rotate') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.05);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.05);
            }
        }

        // ==========================================
        // 2. 遊戲主邏輯
        // ==========================================
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        context.scale(30, 30); 

        const bgm = document.getElementById('bgm');
        const scoreElement = document.getElementById('score');
        const coachMessage = document.getElementById('coach-message');
        
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let score = 0;
        let gameBoard = createMatrix(10, 20);
        let animationId = null;

        const pieces = 'ILJOTSZ';
        const colors = [null, '#e74c3c', '#3498db', '#f1c40f', '#9b59b6', '#2ecc71', '#e67e22', '#1abc9c'];

        function createPiece(type) {
            switch (type) {
                case 'I': return [[0,1,0,0], [0,1,0,0], [0,1,0,0], [0,1,0,0]];
                case 'L': return [[0,2,0], [0,2,0], [0,2,2]];
                case 'J': return [[0,3,0], [0,3,0], [3,3,0]];
                case 'O': return [[4,4], [4,4]];
                case 'T': return [[0,0,0], [5,5,5], [0,5,0]];
                case 'S': return [[0,6,6], [6,6,0], [0,0,0]];
                case 'Z': return [[7,7,0], [0,7,7], [0,0,0]];
            }
        }

        const player = { pos: {x: 0, y: 0}, matrix: null, score: 0 };

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) matrix.push(new Array(w).fill(0));
            return matrix;
        }

        function drawMatrix(matrix, offset, alpha = 1) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = colors[value];
                        context.globalAlpha = alpha;
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                        context.globalAlpha = 1;
                        context.strokeStyle = 'rgba(0,0,0,0.3)';
                        context.lineWidth = 0.05;
                        context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function collide(board, obj) {
            const m = obj.matrix;
            const o = obj.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (board[y + o.y] && board[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function merge(board, obj) {
            obj.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        board[y + obj.pos.y][x + obj.pos.x] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(gameBoard, player)) {
                player.pos.y--;
                merge(gameBoard, player);
                playSound('drop');
                playerReset();
                sweep();
            }
            dropCounter = 0;
        }

        function playerMove(offset) {
            player.pos.x += offset;
            if (collide(gameBoard, player)) {
                player.pos.x -= offset;
            } else {
                playSound('move');
            }
            updateCoach();
        }

        function playerRotate() {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, 1);
            while (collide(gameBoard, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -1);
                    player.pos.x = pos;
                    return;
                }
            }
            playSound('rotate');
            updateCoach();
        }

        function playerHardDrop() {
            player.pos = getGhostPos();
            playerDrop();
        }

        function playerReset() {
            player.matrix = createPiece(pieces[Math.floor(Math.random() * pieces.length)]);
            player.pos.y = 0;
            player.pos.x = Math.floor(gameBoard[0].length / 2) - Math.floor(player.matrix[0].length / 2);
            if (collide(gameBoard, player)) {
                gameBoard.forEach(row => row.fill(0));
                score = 0;
                updateScore();
            }
            updateCoach();
        }

        function sweep() {
            let rowCount = 1;
            let cleared = false;
            outer: for (let y = gameBoard.length - 1; y >= 0; --y) {
                for (let x = 0; x < gameBoard[y].length; ++x) {
                    if (gameBoard[y][x] === 0) continue outer;
                }
                const row = gameBoard.splice(y, 1)[0].fill(0);
                gameBoard.unshift(row);
                ++y;
                score += rowCount * 100;
                rowCount *= 2;
                cleared = true;
            }
            if (cleared) playSound('clear');
            updateScore();
        }

        function getGhostPos() {
            const ghost = { matrix: player.matrix, pos: { x: player.pos.x, y: player.pos.y } };
            while (!collide(gameBoard, ghost)) { ghost.pos.y++; }
            ghost.pos.y--;
            return ghost.pos;
        }

        function updateCoach() {
            let bestRotations = 0;
            let bestX = player.pos.x;
            let maxDepth = -1;
            const origMatrix = JSON.parse(JSON.stringify(player.matrix));
            
            for (let r = 0; r < 4; r++) {
                let tempPlayer = { matrix: JSON.parse(JSON.stringify(player.matrix)), pos: {x: 0, y: 0} };
                if (r > 0) rotate(tempPlayer.matrix, 1);
                
                for (let x = -2; x < gameBoard[0].length + 2; x++) {
                    tempPlayer.pos.x = x;
                    tempPlayer.pos.y = 0;
                    if (!collide(gameBoard, tempPlayer)) {
                        while (!collide(gameBoard, tempPlayer)) { tempPlayer.pos.y++; }
                        tempPlayer.pos.y--;
                        
                        if (tempPlayer.pos.y > maxDepth) {
                            maxDepth = tempPlayer.pos.y;
                            bestX = x;
                            bestRotations = r;
                        }
                    }
                }
                player.matrix = tempPlayer.matrix; 
            }
            player.matrix = origMatrix; 

            let diffX = bestX - player.pos.x;
            let moveText = diffX === 0 ? "保持此列" : (diffX > 0 ? `向右移 ${diffX} 格` : `向左移 ${Math.abs(diffX)} 格`);
            let rotText = bestRotations > 0 ? `，旋轉 ${bestRotations} 次` : "，不需旋轉";
            coachMessage.innerHTML = `${moveText}<br>${rotText}`;
        }

        function draw() {
            context.fillStyle = '#1a252f';
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(gameBoard, {x: 0, y: 0});
            
            const ghostPos = getGhostPos();
            drawMatrix(player.matrix, ghostPos, 0.3); 
            drawMatrix(player.matrix, player.pos);
        }

        function update(time = 0) {
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) playerDrop();
            draw();
            animationId = requestAnimationFrame(update);
        }

        function updateScore() { scoreElement.innerText = score; }

        // ==========================================
        // 3. 事件監聽 (鍵盤與手機觸控)
        // ==========================================

        // 電腦鍵盤事件
        document.addEventListener('keydown', event => {
            if([32, 37, 38, 39, 40].indexOf(event.keyCode) > -1) {
                event.preventDefault();
            }
            if (event.keyCode === 37) playerMove(-1);        
            else if (event.keyCode === 39) playerMove(1);   
            else if (event.keyCode === 40) playerDrop();    
            else if (event.keyCode === 38) playerRotate();  
            else if (event.keyCode === 32) playerHardDrop();
        });

        // 綁定虛擬按鍵事件 (使用 pointerdown 支援滑鼠與觸控)
        function bindTouch(id, action) {
            const btn = document.getElementById(id);
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault(); // 防止觸發預設點擊與雙擊縮放
                action();
            });
        }
        
        bindTouch('btn-left', () => playerMove(-1));
        bindTouch('btn-right', () => playerMove(1));
        bindTouch('btn-down', () => playerDrop());
        bindTouch('btn-rotate', () => playerRotate());
        bindTouch('btn-drop', () => playerHardDrop());

        // 開始按鈕
        document.getElementById('start-btn').addEventListener('click', () => {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            bgm.play().catch(() => console.log('瀏覽器阻擋自動播放'));
            
            if (!animationId) {
                playerReset();
                updateScore();
                update();
            }
            document.getElementById('start-btn').innerText = "遊戲進行中...";
        });
    </script>
</body>
</html>
